name: Deploy Localzet Weather, Atlas and Contributions to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'weather/index.html'
      - 'academy/**'
      - 'contributions/**'
      - 'weather/data/accuracy.json'
      - 'weather/data/historical.json'
      - '.github/workflows/weather-pages.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: localzet-weather-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify engineering atlas content
        run: node academy/tests/validate.mjs
      - name: Verify contribution hub
        run: |
          python3 -m unittest discover -s contributions -p 'test_*.py'
          node --check contributions/app.js
      - name: Assemble public weather and atlas sites
        run: |
          mkdir -p public/weather/data
          mkdir -p public/academy
          cp weather/index.html public/weather/index.html
          cp -R academy/. public/academy/
          cp weather/data/accuracy.json public/weather/data/accuracy.json
          cp weather/data/historical.json public/weather/data/historical.json
          test -s public/weather/index.html
          test -s public/academy/index.html
          test -s public/academy/assets/app.js
          test -s public/academy/content.js
          test -s public/weather/data/accuracy.json
          test -s public/weather/data/historical.json
      - name: Assemble contribution hub
        run: |
          mkdir -p public/contributions
          cp contributions/{index.html,style.css,app.js,data.json,summary.svg} public/contributions/
      - name: Refresh public contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 contributions/collect.py public/contributions; then
            echo "::warning::Contribution refresh failed; serving dated initial snapshot"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
