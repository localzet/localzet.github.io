name: Verify weather forecast accuracy

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localzet-weather-data-writes
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s weather/tests -p 'test_*.py' -v
      - name: Match operational forecasts with verified station observations
        run: python weather/scripts/bench.py
      - name: Publish reproducible metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather/data/accuracy.json
          if ! git diff --cached --quiet; then
            git commit -m "data(weather): update NOAA-based verification metrics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
