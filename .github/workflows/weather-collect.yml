name: Collect weather forecast snapshots

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localzet-weather-data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect operational forecasts
        run: python weather/scripts/collect.py
      - name: Commit snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather/archive/
          if ! git diff --cached --quiet; then
            git commit -m "data(weather): archive operational forecast snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
