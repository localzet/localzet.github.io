name: Atlas browser regression

on:
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - '.github/workflows/atlas-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-browser-main
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify editorial and source integrity
        run: node academy/tests/validate.mjs
      - name: Verify Git fundamentals in disposable repositories
        run: node academy/tests/git-foundations.mjs
      - name: Verify Git internals in disposable repositories
        run: node academy/tests/git-internals.mjs
      - name: Verify Git branching in disposable repositories
        run: node academy/tests/git-branching.mjs
      - name: Verify Git recovery in disposable repositories
        run: node academy/tests/git-recovery.mjs
      - name: Verify Git remotes in disposable repositories
        run: node academy/tests/git-remotes-lab.mjs
      - name: Verify Linux storage exercises on disposable files
        run: bash academy/tests/linux-storage.sh
      - name: Install Linux exercise dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace liburing-dev cpio libseccomp-dev nftables iproute2 iputils-ping openssh-client clang kmod linux-headers-generic mdadm lvm2 cryptsetup tcpdump
      - name: Compile and execute Linux memory examples from published chapters
        run: node academy/tests/linux-memory.mjs
      - name: Verify published Linux boot and maintenance examples
        run: node academy/tests/linux-boot.mjs
      - name: Verify Linux networking and security exercises
        env:
          ATLAS_NETWORK_VM: '1'
        run: node academy/tests/linux-security.mjs
      - name: Compile and verify Linux kernel teaching examples
        run: node academy/tests/linux-kernel.mjs
      - name: Verify Linux capstone projects and disposable storage
        env:
          ATLAS_STORAGE_VM: '1'
        run: node academy/tests/linux-projects.mjs
      - name: Verify Linux review exercises
        env:
          ATLAS_REVIEW_VM: '1'
        run: node academy/tests/linux-review.mjs
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test desktop, tablet and phone in both themes
        run: NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" node academy/tests/browser.cjs
