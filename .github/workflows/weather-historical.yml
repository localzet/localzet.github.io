name: Backtest historical weather model skill

on:
  schedule:
    - cron: '34 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localzet-weather-data-writes
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical verification
        run: python -m unittest discover -s weather/tests -p 'test_*.py' -v
      - name: Compare previous model runs with NOAA station observations
        run: python weather/scripts/historical.py
      - name: Publish historical verification data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather/data/historical.json
          if ! git diff --cached --quiet; then
            git commit -m "data(weather): update 90-day historical model backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
